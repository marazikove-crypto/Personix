<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PeopleFinder — Find anyone</title>

<meta name="description"
content="PeopleFinder — find famous people, actors, scientists, bloggers, athletes and other notable people in different languages.">

<meta name="robots" content="index, follow">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #08090d;
    color: #f5f7fb;
}

header {
    padding: 55px 20px 35px;
    text-align: center;
    background:
        radial-gradient(circle at 50% 0%, #283b70 0%, #111522 45%, #08090d 78%);
}

h1 {
    margin: 0 0 10px;
    font-size: clamp(40px, 8vw, 70px);
    letter-spacing: -2px;
}

.sub {
    color: #b6bfd2;
    font-size: 19px;
}

.search {
    max-width: 850px;
    margin: 30px auto 0;
    display: flex;
    gap: 10px;
}

.search input {
    flex: 1;
    padding: 18px 20px;
    border-radius: 16px;
    border: 1px solid #303746;
    background: #11141d;
    color: white;
    font-size: 17px;
    outline: none;
}

.search input:focus {
    border-color: #7180ff;
}

.search button {
    padding: 0 28px;
    border: none;
    border-radius: 16px;
    background: #6d7cff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.search button:hover {
    opacity: 0.9;
}

.hint {
    max-width: 850px;
    margin: 14px auto 0;
    color: #7f8ba1;
    font-size: 13px;
}

main {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 18px;
}

.status {
    text-align: center;
    color: #9da7ba;
    min-height: 28px;
    margin-bottom: 20px;
}

.error {
    color: #ff9c9c;
}

.card {
    display: none;
    background: #11141b;
    border: 1px solid #292f3d;
    border-radius: 25px;
    padding: 24px;
    box-shadow: 0 20px 60px #0008;
}

.top {
    display: grid;
    grid-template-columns: 270px 1fr;
    gap: 28px;
}

.mainimg {
    width: 100%;
    height: 320px;
    object-fit: cover;
    border-radius: 18px;
    background: #1b1f2a;
}

.name {
    font-size: 40px;
    margin: 5px 0 10px;
}

.desc {
    color: #9fa9bb;
    margin-bottom: 18px;
    font-size: 17px;
}

.bio {
    font-size: 17px;
    line-height: 1.75;
    color: #e0e4ec;
}

.photos {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 25px;
}

.photos img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 14px;
    background: #1b1f2a;
}

.source {
    margin-top: 20px;
    font-size: 13px;
    color: #8993a6;
}

.source a {
    color: #9eabff;
}

footer {
    text-align: center;
    padding: 20px;
    color: #687286;
    font-size: 12px;
}

@media (max-width: 700px) {

    header {
        padding-top: 40px;
    }

    .search {
        flex-direction: column;
    }

    .search button {
        height: 55px;
    }

    .top {
        grid-template-columns: 1fr;
    }

    .mainimg {
        height: 330px;
    }

    .photos {
        grid-template-columns: repeat(2, 1fr);
    }

    .name {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>

<h1>PeopleFinder</h1>

<div id="subtitle" class="sub"></div>

<div class="search">

<input
id="q"
type="text"
autocomplete="off"
aria-label="Person name"
>

<button id="go"></button>

</div>

<div id="hint" class="hint"></div>

</header>

<main>

<div id="status" class="status"></div>

<section id="card" class="card">

<div class="top">

<img
id="mainimg"
class="mainimg"
alt=""
>

<div>

<h2 id="name" class="name"></h2>

<div id="desc" class="desc"></div>

<div id="bio" class="bio"></div>

</div>

</div>

<div id="photos" class="photos"></div>

<div class="source">
<span id="sourceText"></span>
<span id="sourceLink"></span>
</div>

</section>

</main>

<footer>
PeopleFinder · Wikimedia / Wikipedia
</footer>

    placeholder: "Rechercher une personne — par exemple : Elon Musk • 山田涼介 • Cristiano Ronaldo",

    button: "Rechercher",

};


/* =========================
   PHONE / BROWSER LANGUAGE
========================= */

const browserLanguage =
    (navigator.language || "en")
    .toLowerCase()
    .split("-")[0];

const ui =
    translations[browserLanguage] ||
    translations.en;

document.documentElement.lang =
    browserLanguage;

document.getElementById("subtitle").textContent =
    ui.subtitle;

document.getElementById("hint").textContent =
    ui.hint;

document.getElementById("go").textContent =
    ui.button;

document.getElementById("q").placeholder =
    ui.placeholder;

document.getElementById("status").textContent =
    ui.start;

document.getElementById("sourceText").textContent =
    ui.source;


/* =========================
   ELEMENTS
========================= */

const q =
    document.getElementById("q");

const go =
    document.getElementById("go");

const status =
    document.getElementById("status");

const card =
    document.getElementById("card");

const mainimg =
    document.getElementById("mainimg");

const nameEl =
    document.getElementById("name");

const desc =
    document.getElementById("desc");

const bio =
    document.getElementById("bio");

const photos =
    document.getElementById("photos");

const sourceLink =
    document.getElementById("sourceLink");


/* =========================
   WIKIPEDIA LANGUAGES
========================= */

const WIKIS = [
    "ru",
    "en",
    "ja",
    "ko",
    "zh",
    "es",
    "de",
    "fr",
    "pt",
    "it",
    "ar",
    "tr"
];


/* =========================
   NORMALIZE NAME
========================= */

function normalize(text) {

    return (text || "")
        .toLowerCase()
        .normalize("NFKC")
        .replace(/[’'`"«».,:;!?()[\]{}]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


/* =========================
   WIKIDATA SEARCH
========================= */

async function wikidataSearch(query, language) {

    try {

        const url =
            "https://www.wikidata.org/w/api.php" +
            "?action=wbsearchentities" +
            "&search=" +
            encodeURIComponent(query) +
            "&language=" +
            language +
            "&uselang=" +
            language +
            "&limit=8" +
            "&format=json" +
            "&origin=*";

        const response =
            await fetch(url);

        if (!response.ok)
            return [];

        const data =
            await response.json();

        return data.search || [];

    } catch {

        return [];

    }

}


/* =========================
   GET WIKIDATA ENTITY
========================= */

async function getEntity(id) {

    const url =
        "https://www.wikidata.org/w/api.php" +
        "?action=wbgetentities" +
        "&ids=" +
        encodeURIComponent(id) +
        "&props=labels|aliases|descriptions|sitelinks" +
        "&languages=ru|en|ja|ko|zh|es|de|fr|pt|it|ar|tr" +
        "&format=json" +
        "&origin=*";

    const response =
        await fetch(url);

    if (!response.ok)
        throw new Error("Entity error");

    const data =
        await response.json();

    return data.entities?.[id];

}


/* =========================
   WIKIPEDIA SUMMARY
========================= */

async function getSummary(language, title) {

    const url =
        `https://${language}.wikipedia.org/api/rest_v1/page/summary/` +
        encodeURIComponent(title.replaceAll(" ", "_"));

    const response =
        await fetch(url);

    if (!response.ok)
        throw new Error("Summary error");

    return await response.json();

}


/* =========================
   SCORE SEARCH RESULT
========================= */

function scoreResult(result, query) {

    const q =
        normalize(query);

    const label =
        normalize(result.label);

    let score = 0;

    if (label === q)
        score += 160;

    if (label.startsWith(q))
        score += 60;

    if (label.includes(q))
        score += 40;

    if (
        result.aliases &&
        result.aliases.some(
            alias => normalize(alias) === q
        )
    )
        score += 150;

    return score;

}


/* =========================
   FIND PERSON
========================= */

async function findPerson(query) {

    let results = [];

    const searches =
        await Promise.all(
            WIKIS.map(
                language =>
                    wikidataSearch(query, language)
            )
        );

    searches.forEach(
        list => results.push(...list)
    );

    results.sort(
        (a, b) =>
            scoreResult(b, query) -
            scoreResult(a, query)
    );


    /*
       Prefer the language used by
       the visitor's phone.
    */

    const preferredLanguages = [

        browserLanguage,
        "en",
        "ru",
        "ja",
        "ko",
        "zh",
        "es",
        "de",
        "fr",
        "pt",
        "it",
        "tr",
        "ar"

    ];


    for (
        const result of results.slice(0, 15)
    ) {

        try {

            const entity =
                await getEntity(result.id);

            if (!entity)
                continue;

            const links =
                entity.sitelinks || {};


            for (
                const language of preferredLanguages
            ) {

                const key =
                    language + "wiki";

                if (
                    !links[key] ||
                    !links[key].title
                )
                    continue;


                try {

                    const data =
                        await getSummary(
                            language,
                            links[key].title
                        );


                    if (
                        data.type !== "disambiguation" &&
                        (
                            data.extract ||
                            data.thumbnail
                        )
                    ) {

                        return data;

                    }

                } catch {}

            }

        } catch {}

    }


    throw new Error("Person not found");

}


/* =========================
   SEARCH PERSON
========================= */

async function searchPerson() {

    const query =
        q.value.trim();

    if (!query)
        return;


    status.className =
        "status";

    status.textContent =
        ui.searching;

    card.style.display =
        "none";


    try {

        const data =
            await findPerson(query);


        /*
           MAIN INFORMATION
        */

        nameEl.textContent =
            data.title || "";

        desc.textContent =
            data.description || "";

        bio.textContent =
            data.extract || "";


        /*
           MAIN PHOTO
        */

        const mainPhoto =
            data.thumbnail?.source || "";


        if (mainPhoto) {

            mainimg.src =
                mainPhoto;

            mainimg.style.display =
                "block";

        } else {

            mainimg.style.display =
                "none";

        }


        /*
           WIKIPEDIA ARTICLE
        */

        sourceLink.innerHTML = "";

        if (
            data.content_urls &&
            data.content_urls.desktop &&
            data.content_urls.desktop.page
        ) {

            const link =
                document.createElement("a");

            link.href =
                data.content_urls.desktop.page;

            link.target =
                "_blank";

            link.rel =
                "noopener";

            link.textContent =
                ui.article;

            sourceLink.appendChild(link);

        }


        /*
           PHOTOS
        */

        photos.innerHTML = "";


        try {

            const mediaUrl =
                "https://commons.wikimedia.org/w/api.php" +
                "?action=query" +
                "&generator=search" +
                "&gsrsearch=" +
                encodeURIComponent(
                    data.title
                ) +
                "&gsrnamespace=6" +
                "&gsrlimit=10" +
                "&prop=imageinfo" +
                "&iiprop=url" +
                "&iiurlwidth=500" +
                "&format=json" +
                "&origin=*";


            const mediaResponse =
                await fetch(mediaUrl);

            const media =
                await mediaResponse.json();


            Object
                .values(
                    media.query?.pages || {}
                )
                .slice(0, 8)
                .forEach(item => {

                    const image =
                        item.imageinfo?.[0]?.thumburl ||
                        item.imageinfo?.[0]?.url;

                    if (!image)
                        return;


                    const img =
                        document.createElement("img");

                    img.src =
                        image;

                    img.alt =
                        data.title;

                    img.loading =
                        "lazy";

                    photos.appendChild(img);

                });

        } catch {}


        status.textContent =
            ui.found + ": " +
            data.title;

        card.style.display =
            "block";


    } catch {

        status.className =
            "status error";

        status.textContent =
            ui.error;

    }

}


/* =========================
   EVENTS
========================= */

go.addEventListener(
    "click",
    searchPerson
);

q.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            searchPerson();

        }

    }
);

</script>
