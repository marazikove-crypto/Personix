<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeopleFinder — Найди любого человека</title>
<meta name="description" content="PeopleFinder — найди любого известного человека: актёра, учёного, блогера, спортсмена, музыканта и других людей. Поиск на разных языках.">
<meta name="robots" content="index, follow">
<meta property="og:title" content="PeopleFinder — Найди любого человека">
<meta property="og:description" content="Поиск известных людей на разных языках с биографией и фотографиями.">
<meta property="og:type" content="website">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#08090d;color:#f5f7fb}
header{padding:42px 20px 30px;text-align:center;background:radial-gradient(circle at 50% 0,#24335c 0,#10131e 45%,#08090d 75%)}
h1{font-size:clamp(34px,7vw,64px);margin:10px 0 8px}.sub{color:#aeb7ca;font-size:17px}
.search{max-width:820px;margin:26px auto 0;display:flex;gap:10px}.search input{flex:1;padding:17px 20px;border-radius:15px;border:1px solid #303746;background:#11141d;color:white;font-size:17px;outline:none}.search button{padding:0 25px;border:0;border-radius:15px;background:#6d7cff;color:white;font-weight:700;font-size:16px;cursor:pointer}
main{max-width:1100px;margin:35px auto;padding:0 18px}.status{text-align:center;color:#9da7ba;min-height:28px}.card{display:none;background:#11141b;border:1px solid #292f3d;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0008}.top{display:grid;grid-template-columns:250px 1fr;gap:26px}.mainimg{width:100%;height:300px;object-fit:cover;border-radius:18px;background:#1b1f2a}.name{font-size:38px;margin:5px 0 10px}.desc{color:#9fa9bb;margin-bottom:18px}.bio{font-size:17px;line-height:1.7;color:#e0e4ec}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}.photos img{width:100%;height:150px;object-fit:cover;border-radius:14px;background:#1b1f2a}.source{margin-top:18px;font-size:13px;color:#8993a6}.source a{color:#9eabff}.error{color:#ff9c9c}
.hint{max-width:820px;margin:13px auto 0;color:#7f8ba1;font-size:13px}
@media(max-width:700px){.search{flex-direction:column}.search button{height:54px}.top{grid-template-columns:1fr}.mainimg{height:330px}.photos{grid-template-columns:repeat(2,1fr)}.name{font-size:30px}}
</style>
</head>
<body>
<header>
<h1>PeopleFinder</h1>
<div class="sub">Найди любого человека</div>
<div class="search">
<input id="q" aria-label="Имя человека" placeholder="Найди любого человека — например: Илон Маск • 山田涼介 • Cristiano Ronaldo" autocomplete="off">
<button id="go">Найти</button>
</div>
<div class="hint">Пиши имя на русском, английском, японском, китайском, корейском и других языках.</div>
</header>
<main>
<div id="status" class="status">Напиши имя — я найду информацию о человеке</div>
<section id="card" class="card">
<div class="top">
<img id="mainimg" class="mainimg" alt="">
<div>
<h2 id="name" class="name"></h2>
<div id="desc" class="desc"></div>
<div id="bio" class="bio"></div>
</div>
</div>
<div id="photos" class="photos"></div>
<div class="source">Источник данных: Wikimedia / Wikipedia. <span id="sourceLink"></span></div>
</section>
</main>
<footer style="text-align:center;padding:10px 18px 35px;color:#687286;font-size:12px">PeopleFinder · данные предоставляются Wikimedia / Wikipedia</footer>
<script>
const q=document.getElementById('q'),go=document.getElementById('go'),status=document.getElementById('status'),card=document.getElementById('card');
const mainimg=document.getElementById('mainimg'),nameEl=document.getElementById('name'),desc=document.getElementById('desc'),bio=document.getElementById('bio'),photos=document.getElementById('photos'),sourceLink=document.getElementById('sourceLink');

const WIKIS=['ru','en','ja','ko','zh','es','de','fr','pt','it','ar','tr'];

function norm(s){
  return (s||'').toLowerCase().normalize('NFKC')
    .replace(/[’'`"«».,:;!?()[\]{}]/g,' ')
    .replace(/\s+/g,' ').trim();
}

async function wikiSearch(lang,query){
  const url=`https://${lang}.wikipedia.org/w/rest.php/v1/search/page?q=${encodeURIComponent(query)}&limit=8`;
  try{
    const r=await fetch(url); if(!r.ok)return [];
    const d=await r.json(); return (d.pages||[]).map(p=>({...p,lang}));
  }catch{return []}
}

async function wikidataSearch(query, language){
  const url=`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(query)}&language=${language}&uselang=${language}&limit=8&format=json&origin=*`;
  try{
    const r=await fetch(url); if(!r.ok)return [];
    const d=await r.json(); return (d.search||[]).map(x=>({...x,searchLang:language}));
  }catch{return []}
}

function qScore(x,query){
  const qn=norm(query), label=norm(x.label), desc=norm(x.description);
  let s=0;
  if(label===qn)s+=160;
  if(label.startsWith(qn))s+=60;
  if(label.includes(qn))s+=35;
  if((x.aliases||[]).some(a=>norm(a)===qn))s+=150;
  if((x.aliases||[]).some(a=>norm(a).includes(qn)))s+=70;
  if(x.sitelinks)s+=Math.min(20,Object.keys(x.sitelinks).length);
  if(desc)s+=4;
  return s;
}

async function getEntity(id){
  const url=`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${encodeURIComponent(id)}&props=labels|aliases|descriptions|sitelinks|claims&languages=ru|en|ja|ko|zh|es|de|fr|pt|it|ar|tr&format=json&origin=*`;
  const r=await fetch(url); if(!r.ok)throw new Error('entity');
  const d=await r.json(); return d.entities?.[id];
}

async function getSummary(lang,title){
  const url=`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replaceAll(' ','_'))}`;
  const r=await fetch(url); if(!r.ok)throw new Error('summary');
  return await r.json();
}

async function findBest(query){
  // 1) First use Wikidata: it understands aliases, transliterations and names
  // in different languages much better than relying on one Wikipedia search ranking.
  const wd=(await Promise.all(WIKIS.map(l=>wikidataSearch(query,l)))).flat();
  wd.sort((a,b)=>qScore(b,query)-qScore(a,query));

  for(const hit of wd.slice(0,12)){
    try{
      const e=await getEntity(hit.id);
      if(!e)continue;
      const links=e.sitelinks||{};
      // Prefer an English/Russian article, then another available language.
      for(const lang of ['en','ru','ja','ko','zh','es','de','fr','pt','it','tr','ar']){
        const key=lang+'wiki';
        if(links[key]?.title){
          try{
            const d=await getSummary(lang,links[key].title);
            if(d.type!=='disambiguation' && (d.extract||d.thumbnail))
              return {data:d, entity:e, lang};
          }catch{}
        }
      }
    }catch{}
  }

  // 2) Fallback: search Wikipedia directly in several languages.
  const all=(await Promise.all(WIKIS.map(l=>wikiSearch(l,query)))).flat();
  all.sort((a,b)=>{
    const aq=norm(query), at=norm(a.title), bt=norm(b.title);
    return ((bt===aq?100:bt.includes(aq)?30:0)+(b.thumbnail?5:0))
         -((at===aq?100:at.includes(aq)?30:0)+(a.thumbnail?5:0));
  });
  for(const p of all.slice(0,12)){
    try{
      const d=await getSummary(p.lang,p.title);
      if(d.type!=='disambiguation' && (d.extract||d.thumbnail))
        return {data:d,entity:null,lang:p.lang};
    }catch{}
  }
  throw new Error('notfound');
}

async function searchPerson(){
  const query=q.value.trim(); if(!query)return;
  status.textContent='Проверяю имя и варианты написания…';
  status.className='status'; card.style.display='none';
  try{
    const result=await findBest(query), data=result.data;
    nameEl.textContent=data.title||'Неизвестный человек';
    desc.textContent=data.description||'Известная личность';
    bio.textContent=data.extract||'Описание не найдено.';

    const thumb=data.thumbnail?.source||'';
    mainimg.src=thumb; mainimg.style.display=thumb?'block':'none';
    sourceLink.innerHTML=data.content_urls?.desktop?.page
      ? `<a target="_blank" rel="noopener" href="${data.content_urls.desktop.page}">Открыть статью</a>`:'';

    photos.innerHTML='';
    // Use the resolved official title, not the original misspelled/transliterated query.
    const media=await fetch(
      'https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+
      encodeURIComponent(data.title||query)+
      '&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url|mime&iiurlwidth=500&format=json&origin=*'
    ).then(r=>r.json());

    Object.values(media.query?.pages||{}).slice(0,8).forEach(x=>{
      const u=x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url;
      if(u){
        const im=document.createElement('img');
        im.src=u; im.alt=data.title||query; photos.appendChild(im);
      }
    });

    status.textContent=`Найдено: ${data.title}`;
    card.style.display='block';
  }catch(e){
    status.textContent='Не удалось точно определить человека. Попробуй добавить фамилию или написать имя на другом языке.';
    status.className='status error';
  }
}
go.onclick=searchPerson;
q.addEventListener('keydown',e=>{if(e.key==='Enter')searchPerson()});
</script>
</body></html>
